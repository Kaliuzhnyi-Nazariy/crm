<app-content title="Dashboard" [secondaryFunction]="button" class="w-full">
  @if (layout() === 'first') {
    <app-first-layout />
  }
  @if (layout() === 'second') {
    <app-second-layout />
  }
  @if (layout() === 'third') {
    <app-third-layout />
  }
  @if (layout() === 'forth') {
    <app-forth-layout />
  }
</app-content>

<app-layouts-settings-modal
  [(visible)]="visible"
  ngSkipHydration
  (layoutChange)="onLayoutChanged($event)"
></app-layouts-settings-modal>
