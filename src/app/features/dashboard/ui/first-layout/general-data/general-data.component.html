<div class="bg-white rounded-md w-full rulled-grid">
  @for (data of generalData(); track data.id) {
    <div [class]="data.customClass" class="flex items-center justify-between card">
      <div class="mt-2 flex flex-col items-baseline justify-between">
        <div class="text-2xl font-semibold text-gray-900">
          @if (data.isValute) {
            ${{ data.amount }}
          } @else {
            {{ data.amount }}
          }
        </div>

        <span class="text-sm font-medium text-gray-500">{{ data.title }}</span>

        <span
          [class]="data.percentage >= 0 ? 'text-(--green-100)' : 'text-(--red-100)'"
          class="text-sm font-medium flex"
        >
          {{ Math.abs(data.percentage) }}%
          @if (data.percentage > 0) {
            <svg data-p-icon="angle-up"></svg>
          } @else {
            <svg data-p-icon="angle-down"></svg>
          }
        </span>
      </div>
      <div class="flex items-center justify-center size-14 rounded-full bg-(--primary-30)">
        <div class="text-(--primary-100) text-2xl font-bold">
          <ng-container *ngComponentOutlet="data.icon" />
        </div>
      </div>
    </div>
  }
</div>
