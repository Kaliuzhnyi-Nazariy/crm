<app-info-block title="Finance Report" [isHidden]="true" [isCuttedBottom]="true">
  <div class="flex justify-between items-center">
    <h3 class="text-body-lg">Finance Report</h3>
    <p-select
      [options]="rangeLabels"
      [(ngModel)]="selectedRange"
      optionLabel="label"
      optionValue="value"
      placeholder="Select a range"
      class="w-full md:w-56 bg-black"
      [pt]="{ option: { class: 'bg-black/70 backdrop-blur-md text-white px-2 py-1' } }"
    />
  </div>
  <p-chart type="bar" [data]="basicData" [options]="basicOptions" class="block h-74 mt-7" />
</app-info-block>
