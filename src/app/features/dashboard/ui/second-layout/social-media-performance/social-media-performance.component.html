<app-info-block
  title="Social Media Performance"
  class="h-99! flex flex-col"
  extraStylesForContent="flex flex-col flex-1"
>
  @if (socialMediaPerformance.length > 0) {
    <ul class="mt-6 flex flex-col gap-6">
      @for (smp of socialMediaPerformance; track smp.socialMedia) {
        <li class="flex flex-col gap-2">
          <div class="flex items-center justify-between text-body-xs text-(--general-100)">
            <p class="font-medium">{{ smp.socialMedia }}</p>
            <p class="font-light text-(--general-80)">{{ smp.visits }} visits</p>
          </div>
          <!-- <div class="h-2 w-full bg-gray-100 rounded-full overflow-hidden">
            <div
              class="h-full bg-blue-600 rounded-full transition-all duration-500"
              [style.width.%]="(smp.visits / maxVisits) * 100"
            ></div>
          </div> -->
          <div class="h-2 w-full bg-gray-100 rounded-full overflow-hidden">
            <div
              class="h-full bg-(--primary-100) rounded-full transition-all duration-500"
              [style.width.%]="(smp.visits / graphCeiling) * 100"
            ></div>
          </div>
        </li>
      }
    </ul>
  } @else {
    <div class="flex flex-col justify-center items-center flex-1">
      <p>No data available</p>
    </div>
  }
</app-info-block>
