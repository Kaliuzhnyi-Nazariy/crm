<app-info-block title="Age Distribution" [isCuttedBottom]="true">
  <app-doughnut />

  <ul class="flex flex-col gap-3 mt-7">
    @for (stat of ageStats(); track stat.age) {
      <li class="flex items-center justify-between">
        <div class="flex items-center gap-1">
          <div class="size-3 rounded-xs" [style.background]="stat.color"></div>

          <p class="text-body-xs text-(--general-80)">
            {{ stat.age }}{{ stat.age === 'Others' ? '' : ' years' }}
          </p>
        </div>

        <p style="font: var(--font-caption-1)">{{ stat.percentage }}%</p>
      </li>
    }
  </ul>
  <div class="h-px w-full bg-(--general-40) mt-6"></div>

  <a routerLink="/dashboard" class="block decoration-none text-(--primary-100) mt-5"
    >Find out more</a
  >
</app-info-block>
