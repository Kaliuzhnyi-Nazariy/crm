<div class="mt-6 flex flex-col gap-6">
  <h4 class="text-block-header">Price</h4>
  <div class="grid grid-cols-2 gap-7">
    <app-input
      label="Product Price"
      placeholder="Enter Price"
      [(value)]="productPrice"
      type="number"
    ></app-input>
    <app-input
      label="Discount Price"
      placeholder="Price at Discount"
      [(value)]="productDiscountPrice"
      type="number"
    ></app-input>
  </div>

  <app-toggler label="Add tax for this product" [(status)]="addTax"></app-toggler>
</div>
