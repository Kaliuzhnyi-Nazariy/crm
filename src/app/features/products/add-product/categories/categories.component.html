<ul class="mt-6 flex flex-col gap-3">
  @for (c of categories; track c) {
    <li>
      <label class="flex items-center gap-3">
        <input
          type="checkbox"
          class="border border-(--general-50) size-5 rounded"
          [checked]="selectedCategories().includes(c)"
          (change)="toggleCategory(c)"
        />
        <!-- <div class="border border-(--general-50) size-5 rounded "></div> -->
        <p>{{ c }}</p>
      </label>
    </li>
  }
</ul>
<button type="button" class="text-(--primary-100) mt-5">Create New</button>
