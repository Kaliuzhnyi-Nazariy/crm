<div class="flex flex-col w-full flex-1 min-h-0 mt-5">
  <table
    class="w-full border-collapse text-left text-body-xs leading-[1.358]! flex flex-col flex-1 min-h-0"
  >
    <thead class="flex w-full shrink-0">
      <tr class="text-(--general-80) w-full flex items-center">
        <th class="w-[5%] shrink-0 py-4">
          <input
            type="checkbox"
            class="rounded border-gray-300 cursor-pointer"
            (change)="headerCheckboxHandler()()"
            [checked]="selectAllOrdersCheckbox()"
          />
        </th>
        <th class="w-[12.5%] shrink-0 py-4">Order</th>
        <th class="w-[12.5%] shrink-0 py-4">Date</th>
        <th class="w-[17%] shrink-0 py-4">Customer</th>
        <th class="w-[17%] shrink-0 py-4">Payment status</th>
        <th class="w-[17%] shrink-0 py-4">Order Status</th>
        <th class="w-[19%] shrink-0 py-4 pr-4">Total</th>
      </tr>
    </thead>

    <tbody
      class="divide-y divide-(--general-40) text-(--general-100) font-light w-full flex flex-col flex-1 min-h-0 overflow-y-auto"
    >
      @for (o of orders(); track o.order) {
        <tr class="w-full flex items-center shrink-0">
          <td class="w-[5%] shrink-0 py-4">
            <input
              type="checkbox"
              class="rounded border-gray-300 cursor-pointer"
              [checked]="isChecked(o.order)"
              (change)="checkboxHandler()(o.order)"
            />
          </td>
          <td class="w-[12.5%] shrink-0 py-4 font-bold">{{ o.order }}</td>
          <td class="w-[12.5%] shrink-0 py-4">{{ o.date }}</td>
          <td class="w-[17%] shrink-0 py-4">{{ o.customer }}</td>
          <td class="w-[17%] shrink-0 py-4">{{ o.payment_status }}</td>
          <td class="w-[17%] shrink-0 py-4">{{ o.order_status }}</td>
          <td class="w-[19%] shrink-0 py-4 pr-4">{{ o.total }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
