<div class="flex flex-col w-full flex-1 min-h-0 mt-5">
  <!-- <table
    class="w-full border-collapse text-left text-body-xs leading-[1.358]! flex flex-col flex-1 min-h-0"
  > -->
  <table
    class="w-full border-collapse text-left text-body-xs leading-[1.358]! flex flex-col flex-1 min-h-0"
  >
    <thead class="flex w-full shrink-0">
      <tr class="text-(--general-80) w-full flex items-center">
        <th class="w-[5%] flex items-center justify-start">
          <input
            type="checkbox"
            class="rounded border-gray-300 cursor-pointer size-5 mx-auto"
            (change)="headerCheckboxHandler()()"
            [checked]="selectAllOrdersCheckbox()"
          />
        </th>
        <!-- Dynamiczne nagłówki kolumn wstrzyknięte z zewnątrz -->
        @if (headerTemplate()) {
          <ng-container [ngTemplateOutlet]="headerTemplate()!" />
        }
      </tr>
    </thead>

    <tbody
      class="text-(--general-100) font-light w-full flex flex-col flex-1 min-h-0 overflow-y-auto scroll"
    >
      @for (o of orders(); track trackIdFn()(o)) {
        <tr class="w-full flex items-center shrink-0">
          <!-- Komórka z checkboxem wiersza dziedziczy style td automatycznie -->
          <td class="w-[5%] flex items-center justify-start">
            <input
              type="checkbox"
              class="rounded border-gray-300 cursor-pointer size-5 mx-auto"
              [checked]="isChecked(o)"
              (change)="checkboxHandler()(trackIdFn()(o))"
            />
          </td>
          <!-- Dynamiczny wiersz wstrzyknięty z zewnątrz -->
          @if (rowTemplate()) {
            <ng-container
              [ngTemplateOutlet]="rowTemplate()!"
              [ngTemplateOutletContext]="{ $implicit: o }"
            />
          }
        </tr>
      } @empty {
        <tr class="w-full flex justify-center py-8 text-gray-500">
          <td class="py-4 text-center w-full">No data available.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
