<aside class="p-4 flex flex-col gap-7 w-62.5">
  @for (group of menuGroups; track group.title || 'main') {
    <div class="flex flex-col">
      @if (group.title) {
        <span class="pl-4 text-xs font-semibold capitalize text-(--general-60) mb-3">
          {{ group.title }}
        </span>
      }

      @for (p of group.items; track p.name) {
        <app-list-item [name]="p.name" [icon]="p.icon" [link]="p.link" [badge]="p.badge" />
      }
    </div>
  }
</aside>
