<a
  [routerLink]="link()"
  routerLinkActive="bg-(--primary-100) text-white hover:bg-(--primary-100)! hover:text-white! focus:bg-(--primary-100)! focus:text-white! "
  [routerLinkActiveOptions]="{
    paths: 'subset',
    matrixParams: 'ignored',
    queryParams: 'ignored',
    fragment: 'ignored',
  }"
  class="pl-4 py-3 pr-3 flex items-center gap-4 text-(--general-80) transition-colors duration-150 rounded-sm hover:bg-(--primary-100)/30 hover:text-white/80 focus:outline-none focus:bg-(--primary-100)/30 focus:text-white/80"
>
  <ng-container *ngComponentOutlet="icon()" />
  <h2>{{ name() }}</h2>
</a>
