<div class="flex items-center gap-3 relative">
  <!-- here would be a photo -->
  <div class="size-9 rounded-full bg-purple-700"></div>

  <button
    (click)="toggleMenu($event)"
    type="button"
    class="text-(--general-70) flex items-center gap-5 hover:cursor-pointer hover:text-(--general-100) focus:outline-none focus:text-(--general-100)"
  >
    <p>Name</p>
    <svg data-p-icon="angle-down"></svg>
  </button>

  @if (isMenuOpen) {
    <div class="absolute bg-(--general-40) w-40 h-20 top-full right-0"></div>
  }
</div>
